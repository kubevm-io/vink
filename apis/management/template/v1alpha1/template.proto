syntax = "proto3";

package vink.kubevm.io.apis.management.template.v1alpha1;

import "google/protobuf/empty.proto";
import "types/types.proto";
import "types/template.proto";

option go_package = "github.com/kubevm.io/vink/apis/management/template/v1alpha1";

service TemplateManagement {
    rpc Get(vink.kubevm.io.apis.types.NamespaceName) returns (vink.kubevm.io.apis.types.Template);

    rpc List(vink.kubevm.io.apis.types.ListRequest) returns (vink.kubevm.io.apis.types.TemplateList);

    rpc Create(vink.kubevm.io.apis.types.Template) returns (vink.kubevm.io.apis.types.Template);

    rpc Update(vink.kubevm.io.apis.types.Template) returns (vink.kubevm.io.apis.types.Template);

    rpc Delete(vink.kubevm.io.apis.types.NamespaceName) returns (google.protobuf.Empty);

    rpc Watch(vink.kubevm.io.apis.types.WatchRequest) returns (stream WatchResponse);
}

message WatchResponse {
    repeated vink.kubevm.io.apis.types.Template added = 1;

    repeated vink.kubevm.io.apis.types.Template modified = 2;

    repeated vink.kubevm.io.apis.types.Template deleted = 3;
}
