syntax = "proto3";

package vink.kubevm.io.apis.management.sc.v1alpha1;

import "google/protobuf/empty.proto";
import "types/types.proto";
import "types/sc.proto";

option go_package = "github.com/kubevm.io/vink/apis/management/sc/v1alpha1";

service StorageClassManagement {
    rpc Get(vink.kubevm.io.apis.types.NamespaceName) returns (vink.kubevm.io.apis.types.StorageClass);

    rpc List(vink.kubevm.io.apis.types.ListRequest) returns (vink.kubevm.io.apis.types.StorageClassList);

    rpc Create(vink.kubevm.io.apis.types.StorageClass) returns (vink.kubevm.io.apis.types.StorageClass);

    rpc Update(vink.kubevm.io.apis.types.StorageClass) returns (vink.kubevm.io.apis.types.StorageClass);

    rpc Delete(vink.kubevm.io.apis.types.NamespaceName) returns (google.protobuf.Empty);

    rpc Watch(vink.kubevm.io.apis.types.WatchRequest) returns (stream WatchResponse);
}

message WatchResponse {
    repeated vink.kubevm.io.apis.types.StorageClass added = 1;

    repeated vink.kubevm.io.apis.types.StorageClass modified = 2;

    repeated vink.kubevm.io.apis.types.StorageClass deleted = 3;
}
