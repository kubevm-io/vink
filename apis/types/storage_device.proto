syntax = "proto3";

package vink.kubevm.io.apis.types;

option go_package = "github.com/kubevm.io/vink/apis/types";

message StorageDevice {
    StorageDeviceSpec spec = 1;
    StorageDeviceStatus status = 2;
}

message StorageDeviceList {
    repeated StorageDevice items = 1;
}

message StorageDeviceSpec {
    string nodeName = 1;
}

message StorageDeviceStatus {
    repeated BlockDeviceStatus blockDevices = 1;
}

message BlockDeviceStatus {
    bool up = 1;

    int32 osd = 2;

    string bluestoreBdevDevNode = 3;

    string bluestoreBdevType = 4;

    float usage = 5;

    float total = 6;
}
