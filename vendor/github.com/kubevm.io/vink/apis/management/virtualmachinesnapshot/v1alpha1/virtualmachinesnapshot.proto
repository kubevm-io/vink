syntax = "proto3";

package vink.kubevm.io.apis.management.virtualmachinesnapshot.v1alpha1;

import "google/protobuf/empty.proto";
import "types/types.proto";
import "types/virtualmachinesnapshot.proto";

option go_package = "github.com/kubevm.io/vink/apis/management/virtualmachinesnapshot/v1alpha1";

service VirtualMachineSnapshotManagement {
    rpc Get(vink.kubevm.io.apis.types.NamespaceName) returns (vink.kubevm.io.apis.types.VirtualMachineSnapshot);

    rpc List(vink.kubevm.io.apis.types.ListRequest) returns (vink.kubevm.io.apis.types.VirtualMachineSnapshotList);

    rpc Create(vink.kubevm.io.apis.types.VirtualMachineSnapshot) returns (vink.kubevm.io.apis.types.VirtualMachineSnapshot);

    rpc Update(vink.kubevm.io.apis.types.VirtualMachineSnapshot) returns (vink.kubevm.io.apis.types.VirtualMachineSnapshot);

    rpc Delete(vink.kubevm.io.apis.types.NamespaceName) returns (google.protobuf.Empty);

    rpc Watch(vink.kubevm.io.apis.types.WatchRequest) returns (stream WatchResponse);
}

message WatchResponse {
    repeated vink.kubevm.io.apis.types.VirtualMachineSnapshot added = 1;

    repeated vink.kubevm.io.apis.types.VirtualMachineSnapshot modified = 2;

    repeated vink.kubevm.io.apis.types.VirtualMachineSnapshot deleted = 3;
}
