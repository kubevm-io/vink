syntax = "proto3";

package vink.kubevm.io.apis.management.node.v1alpha1;

import "google/protobuf/empty.proto";
import "types/types.proto";
import "types/node.proto";

option go_package = "github.com/kubevm.io/vink/apis/management/node/v1alpha1";

service NodeManagement {
    rpc Get(vink.kubevm.io.apis.types.NamespaceName) returns (vink.kubevm.io.apis.types.Node);

    rpc List(vink.kubevm.io.apis.types.ListRequest) returns (vink.kubevm.io.apis.types.NodeList);

    rpc Update(vink.kubevm.io.apis.types.Node) returns (vink.kubevm.io.apis.types.Node);

    rpc Delete(vink.kubevm.io.apis.types.NamespaceName) returns (google.protobuf.Empty);

    rpc Watch(vink.kubevm.io.apis.types.WatchRequest) returns (stream WatchResponse);
}

message WatchResponse {
    repeated vink.kubevm.io.apis.types.Node added = 1;

    repeated vink.kubevm.io.apis.types.Node modified = 2;

    repeated vink.kubevm.io.apis.types.Node deleted = 3;
}
