syntax = "proto3";

package vink.kubevm.io.apis.management.nad.v1alpha1;

import "google/protobuf/empty.proto";
import "types/types.proto";
import "types/nad.proto";

option go_package = "github.com/kubevm.io/vink/apis/management/nad/v1alpha1";

service NetworkAttachmentDefinitionManagement {
    rpc Get(vink.kubevm.io.apis.types.NamespaceName) returns (vink.kubevm.io.apis.types.NetworkAttachmentDefinition);

    rpc List(vink.kubevm.io.apis.types.ListRequest) returns (vink.kubevm.io.apis.types.NetworkAttachmentDefinitionList);

    rpc Create(vink.kubevm.io.apis.types.NetworkAttachmentDefinition) returns (vink.kubevm.io.apis.types.NetworkAttachmentDefinition);

    rpc Update(vink.kubevm.io.apis.types.NetworkAttachmentDefinition) returns (vink.kubevm.io.apis.types.NetworkAttachmentDefinition);

    rpc Delete(vink.kubevm.io.apis.types.NamespaceName) returns (google.protobuf.Empty);

    rpc Watch(vink.kubevm.io.apis.types.WatchRequest) returns (stream WatchResponse);
}

message WatchResponse {
    repeated vink.kubevm.io.apis.types.NetworkAttachmentDefinition added = 1;

    repeated vink.kubevm.io.apis.types.NetworkAttachmentDefinition modified = 2;

    repeated vink.kubevm.io.apis.types.NetworkAttachmentDefinition deleted = 3;
}
