syntax = "proto3";

package vink.kubevm.io.apis.management.templateinstance.v1alpha1;

import "google/protobuf/empty.proto";
import "types/types.proto";
import "types/template_instance.proto";

option go_package = "github.com/kubevm.io/vink/apis/management/templateinstance/v1alpha1";

service TemplateInstanceManagement {
    rpc Get(vink.kubevm.io.apis.types.NamespaceName) returns (vink.kubevm.io.apis.types.TemplateInstance);

    rpc List(vink.kubevm.io.apis.types.ListRequest) returns (vink.kubevm.io.apis.types.TemplateInstanceList);

    rpc Create(vink.kubevm.io.apis.types.TemplateInstance) returns (vink.kubevm.io.apis.types.TemplateInstance);

    rpc Update(vink.kubevm.io.apis.types.TemplateInstance) returns (vink.kubevm.io.apis.types.TemplateInstance);

    rpc Delete(vink.kubevm.io.apis.types.NamespaceName) returns (google.protobuf.Empty);

    rpc Watch(vink.kubevm.io.apis.types.WatchRequest) returns (stream WatchResponse);
}

message WatchResponse {
    repeated vink.kubevm.io.apis.types.TemplateInstance added = 1;

    repeated vink.kubevm.io.apis.types.TemplateInstance modified = 2;

    repeated vink.kubevm.io.apis.types.TemplateInstance deleted = 3;
}
