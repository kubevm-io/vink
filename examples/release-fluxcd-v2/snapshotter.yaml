apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshotter
  namespace: vink
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: snapshotter
      sourceRef:
        kind: HelmRepository
        name: vink
        namespace: vink
  targetNamespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
