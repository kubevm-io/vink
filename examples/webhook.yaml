apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: virtualmachinetemplate-vink-webhook
webhooks:
  - name: virtualmachinetemplate.vink.kubevm.io
    rules:
      - apiGroups:
          - vink.kubevm.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - virtualmachinetemplates
    clientConfig:
      # url: https://172.16.1.104:8081/validate-vink-kubevm-io-v1alpha1-virtualmachinetemplate
      url: https://192.168.18.100:8081/validate-vink-kubevm-io-v1alpha1-virtualmachinetemplate
      caBundle: 
    admissionReviewVersions: ["v1"]
    failurePolicy: Fail
    sideEffects: None
---

apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: virtualmachinetemplate-vink-webhook
webhooks:
  - name: virtualmachinetemplate.vink.kubevm.io
    rules:
      - apiGroups:
          - vink.kubevm.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - virtualmachinetemplates
    clientConfig:
      # url: https://172.16.1.104:8081/mutate-vink-kubevm-io-v1alpha1-virtualmachinetemplate
      url: https://192.168.18.100:8081/mutate-vink-kubevm-io-v1alpha1-virtualmachinetemplate
      caBundle: 
    admissionReviewVersions: ["v1"]
    failurePolicy: Fail
    sideEffects: None
---

